name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - NOTICE
  pull_request:
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - NOTICE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Check formatting
        shell: bash
        run: |
          mapfile -d '' go_files < <(git ls-files -z '*.go')
          unformatted="$(gofmt -l "${go_files[@]}")"
          if [[ -n "${unformatted}" ]]; then
            printf '%s\n' "${unformatted}"
            exit 1
          fi

      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD

      - name: Vet
        run: go vet ./...

      - name: Check workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Test with coverage
        shell: bash
        run: |
          go test -race -covermode=atomic -coverprofile=coverage.out ./...
          coverage="$(go tool cover -func=coverage.out | awk '/^total:/ { sub(/%$/, "", $3); print $3 }')"
          if [[ -z "${coverage}" ]]; then
            echo "Unable to read total coverage" >&2
            exit 1
          fi
          awk -v actual="${coverage}" 'BEGIN { if (actual + 0 < 75) exit 1 }'
          printf '### Go coverage\n\n%s%% (minimum 75%%)\n' "${coverage}" >> "${GITHUB_STEP_SUMMARY}"

        if: "!(github.event_name == 'pull_request')"
      - name: Remove stale generated report evidence
        id: report_cleanup
        if: "!cancelled() && (github.event_name == 'pull_request')"
        shell: bash
        run: |
          set -euo pipefail
          test ! -L .github
          rm -f -- .github/go-test-report.md .github/go-test-report.json .github/coverage.svg .github/goreportcard.svg .github/goreportcard-report.md
          rm -rf -- .github/test-results
      - name: Test, race and coverage (GTR v1.1.2)
        id: go_test_report
        uses: soulteary/go-test-report-action@2760569379a1c95a195c602872ba00cd61495d89  # v1.1.3
        with:
          directory: "."
          packages: "./..."
          race: "true"
          coverage_threshold: "75"
          test_args: "-count=1"
          version: "v1.1.2"
          cover_mode: "atomic"
          commit: "false"
        if: github.event_name == 'pull_request'
      - name: Go quality report (v1.1.3)
        if: "!cancelled() && (github.event_name == 'pull_request') && steps.report_cleanup.outcome == 'success'"
        id: go_report_card
        uses: soulteary/goreportcard-action@d4669a9fbea514f5995d749177630ebfee755789  # v1.1.4
        with:
          directory: "."
          version: "v1.1.3"
          threshold: "0"
          report: "true"
          commit: "false"
      - name: Reuse GTR coverage profile
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PROFILE: ${{ steps.go_test_report.outputs.coverage_profile }}
        run: |-
          cp "$PROFILE" coverage.out
      - name: Restore project Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Build static binary
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/error-tracer ./cmd/error-tracer

      - name: Upload read-only PR quality evidence
        if: "always() && steps.report_cleanup.outcome == 'success' && ((github.event_name == 'pull_request'))"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pr-go-quality-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .github/go-test-report.md
            .github/go-test-report.json
            .github/coverage.svg
            .github/goreportcard.svg
            .github/goreportcard-report.md
            .github/test-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
    permissions:
      contents: read
  browser-sdk:
    name: Browser SDK
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Check JavaScript syntax
        run: >-
          bun build sdk/error-tracer.js internal/server/dashboard/dashboard.js
          --target=browser --outdir=/tmp/error-tracer-js

      - name: Test browser SDK
        run: bun test sdk/*.test.js scripts/*.test.mjs

  container:
    name: Container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --tag error-tracer:ci .

      - name: Exercise the locked-down demo image
        shell: bash
        run: |
          container_id="$(docker run --detach --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            --publish 127.0.0.1::8080 error-tracer:ci demo)"
          cleanup() {
            docker logs "${container_id}" || true
            docker rm --force "${container_id}" >/dev/null || true
          }
          trap cleanup EXIT

          host_port="$(docker port "${container_id}" 8080/tcp | awk -F: 'NR == 1 { print $NF }')"
          for _ in {1..20}; do
            if curl --fail --silent --show-error \
              "http://127.0.0.1:${host_port}/api/v1/meta" > /tmp/error-tracer-meta.json; then
              break
            fi
            sleep 0.5
          done

          grep --fixed-strings '"demo_only":true' /tmp/error-tracer-meta.json
          curl --fail --silent --show-error \
            "http://127.0.0.1:${host_port}/readyz" | grep --fixed-strings '"status":"ready"'
          test "$(docker inspect --format '{{.Config.User}}' "${container_id}")" = "65532:65532"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "${container_id}")" = "true"
